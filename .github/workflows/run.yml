name: 刷步数

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: mimotion-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check configured execution hour
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIGURED_HOURS: ${{ vars.CRON_HOURS || '10,12,14' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scheduled_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ "$EVENT_NAME" = "schedule" ]; then
            scheduled_at=$(
              curl --fail --silent --show-error \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" |
                jq --exit-status --raw-output '.created_at'
            )
          fi

          scheduled_hour=$(date -u --date="$scheduled_at" +%-H)
          beijing_hour=$(((scheduled_hour + 8) % 24))
          echo "beijing_hour=${beijing_hour}" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "Manual run; skipping the configured-hour check."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          should_run=false
          IFS=',' read -ra configured_hours <<< "$CONFIGURED_HOURS"
          for raw_hour in "${configured_hours[@]}"; do
            hour=$(echo "$raw_hour" | xargs)
            if ! [[ "$hour" =~ ^([0-9]|1[0-9]|2[0-3])$ ]]; then
              echo "::error::Invalid CRON_HOURS value '$raw_hour'. Use comma-separated UTC hours from 0 to 23."
              exit 1
            fi
            if [ "$((10#$hour))" -eq "$scheduled_hour" ]; then
              should_run=true
            fi
          done

          echo "Scheduled at: ${scheduled_at}; configured UTC hours: ${CONFIGURED_HOURS}; should run: ${should_run}"
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"

      - name: Checkout codes
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: Update system and install zsh
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        if: steps.schedule.outputs.should_run == 'true'
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
          SCHEDULED_BEIJING_HOUR: ${{ steps.schedule.outputs.beijing_hour }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: persist tokens
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "persist tokens trigger by ${{ github.event_name }}"
          git push origin "HEAD:${GITHUB REF NAME}'